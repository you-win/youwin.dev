<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>write — youwin.dev</title>

    <!-- Approximates base-100, oklch(17% 0.016 162), for the mobile browser
         chrome and the PWA splash. Kept in sync by hand; it is the one place a
         theme color is written outside theme.css, because <meta> cannot read a
         custom property. -->
    <meta name="theme-color" content="#09120d" />

    <!-- The authoring app is never indexed and never linked publicly. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- vite-plugin-pwa injects the manifest link; these are the ones iOS needs,
         which it looks for by tag rather than reading the manifest. -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="write" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
