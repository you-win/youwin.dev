[workspace]
resolver = "3"
# Two binaries that never run on the same machine: `youwin-server` is the site,
# `youwin-offsite` is what receives its nightly backup on a different box. They
# share a workspace anyway, because the thing between them is a wire contract —
# `PUT {base}/youwin-YYYY-MM-DD.{db,json}` — and a contract with both ends in one
# `cargo test` is one that cannot drift. See crates/offsite/src/lib.rs.
members = ["crates/server", "crates/offsite"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

# Release builds run on the server (see DESIGN.md "Build"), so favour a smaller,
# faster binary over compile time. LTO and one codegen unit cost a minute or two
# on a redeploy and nothing at runtime.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
