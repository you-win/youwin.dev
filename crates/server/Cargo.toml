[package]
name = "youwin-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
